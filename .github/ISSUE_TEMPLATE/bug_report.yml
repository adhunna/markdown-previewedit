name: Bug report
description: Something in the preview or an export does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please do not use this form — follow [SECURITY.md](https://github.com/adhunna/markdown-previewedit/blob/develop/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown that shows the problem
      description: The smallest piece of Markdown that reproduces it.
      render: markdown
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Preview
        - Mermaid diagrams
        - Export to Word (.docx)
        - Export to PDF
        - Export to HTML
        - Buttons / commands / settings
        - Other
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Markdown PreviewEdit version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help → About → Copy
      placeholder: "1.105.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: View → Output → choose "Markdown PreviewEdit" in the drop-down. Remove anything private.
      render: text
