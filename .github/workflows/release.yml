name: Release

# Builds the extension and publishes a GitHub Release for the version in package.json.
# Starts when a version tag (v1.2.3) is pushed, or by hand from the Actions tab ("Run workflow"),
# in which case the tag is created on the selected branch's commit. See docs/releasing.md.
# Nothing is published to the VS Code Marketplace.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Work out the tag (and check it matches package.json)
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run notices -- --check
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf("## [" + version + "]");
            if (start === -1) { console.error("No CHANGELOG section for " + version); process.exit(1); }
            const rest = text.slice(start).split("\n").slice(1).join("\n");
            const end = rest.search(/^## \[|^\[[^\]]+\]: /m);
            const notes = (end === -1 ? rest : rest.slice(0, end)).trim();
            // Relative links (docs/...) would break on the release page: point them at this tag.
            const base = "https://github.com/" + (process.env.GITHUB_REPOSITORY || "adhunna/MarkDownPreview") + "/blob/" + (process.env.RELEASE_TAG || "v" + version) + "/";
            fs.writeFileSync("release-notes.md", notes.replace(/\]\((?!https?:|mailto:|#)([^)]+)\)/g, (m, link) => "](" + base + link + ")") + "\n");
          '
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$RELEASE_TAG" in v0.*) prerelease="--prerelease" ;; esac
          # --target is used only when the tag does not exist yet (a run started from the Actions tab).
          gh release create "$RELEASE_TAG" ./*.vsix \
            --target "$GITHUB_SHA" \
            --title "MarkDownPreview $RELEASE_TAG" \
            --notes-file release-notes.md \
            $prerelease
